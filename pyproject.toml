[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinbase-crypto-momentum"
version = "0.1.4.12"
description = "Low-resource Coinbase Advanced spot momentum/trend rotation bot"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
